<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA essentials -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="今日大吉" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- SEO & Social sharing -->
    <title>今日大吉 · Your Lucky Day</title>
    <meta name="description" content="每日幸运数字、颜色、方位、星座运程 · Lucky numbers, colors, directions & horoscope" />

    <!-- Open Graph — for WeChat & social sharing previews -->
    <meta property="og:title" content="今日大吉 · Your Lucky Day" />
    <meta property="og:description" content="查看你今日的幸运数字、颜色、方位和星座运程！Check your lucky number, color, direction & horoscope!" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <style>
      /* Prevent flash of white before React loads */
      html, body, #root {
        margin: 0; padding: 0;
        background: #120608;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* Loading screen */
      #splash {
        position: fixed; inset: 0;
        background: linear-gradient(160deg,#120608 0%,#1e0a0a 45%,#130820 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999; transition: opacity .5s;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-title {
        font-size: 52px; color: #FFD700;
        font-family: 'Ma Shan Zheng', serif;
        text-shadow: 0 0 32px rgba(255,165,0,0.5);
        letter-spacing: 6px;
      }
      #splash-sub { font-size: 13px; color: rgba(255,215,0,0.4); letter-spacing: 4px; margin-top: 8px; font-family: sans-serif; }
      .splash-dot {
        width: 8px; height: 8px; border-radius: 50%; background: #FFD700;
        animation: sdot .8s ease-in-out infinite alternate;
      }
      .splash-dot:nth-child(2) { animation-delay: .2s; }
      .splash-dot:nth-child(3) { animation-delay: .4s; }
      @keyframes sdot { from { opacity: .2; transform: scale(.7); } to { opacity: .9; transform: scale(1.2); } }
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap');
    </style>
  </head>
  <body>
    <!-- Splash screen shown while React loads -->
    <div id="splash">
      <div id="splash-title">今日大吉</div>
      <div id="splash-sub">YOUR LUCKY DAY</div>
      <div style="display:flex;gap:10px;margin-top:32px;">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide splash when React is ready
      window.__hideSplash = () => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 500); }
      };
    </script>
  </body>
</html>
