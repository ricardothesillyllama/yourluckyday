  <text x="100" y="130" font-size="48" text-anchor="middle" fill="#FFD700" opacity="0.7">✦</text>
  <text x="412" y="130" font-size="48" text-anchor="middle" fill="#FFD700" opacity="0.7">✦</text>
  <text x="100" y="420" font-size="32" text-anchor="middle" fill="#FFD700" opacity="0.4">✦</text>
  <text x="412" y="420" font-size="32" text-anchor="middle" fill="#FFD700" opacity="0.4">✦</text>
</svg>
