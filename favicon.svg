<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1e0a0a"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FFD700" stroke-width="12" opacity="0.6"/>
  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="#3B0000" opacity="0.8"/>
  <!-- 大 character -->
